name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A GitHub Pages statikus tárhely: a szerveroldali e-mail-küldő útvonal
      # nem futtatható, ezért az exportból kimarad (az űrlap mailto-tartalékot használ).
      - run: rm -rf src/app/api
      - run: npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_STATIC_EXPORT: "1"
          # Élesítés saját domainen (o2tanacsado.hu, CNAME beállítva): BASE_PATH legyen üres,
          # SITE_ENV pedig "production" – ekkor engedi a robots.txt és a meta az indexelést.
          NEXT_PUBLIC_BASE_PATH: /o2-tanacsado
          NEXT_PUBLIC_SITE_ENV: preview
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
